<section class="section-heading"><h2>Рейтинг учеников</h2><a href="{% url 'leaderboard' %}">Весь рейтинг →</a></section><section class="card table-wrap"><table><thead><tr><th>Место</th><th>Ученик</th><th>Баллы</th></tr></thead><tbody>{% for student in top_students %}<tr><td>{{ student.place }}</td><td>{{ student.name }} {{ student.surname }}</td><td>{{ student.total_points }}</td></tr>{% empty %}<tr><td colspan="3">Первые результаты появятся после завершения тестов.</td></tr>{% endfor %}</tbody></table></section>
