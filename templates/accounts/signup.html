{% block title %}Регистрация — IMEST{% endblock %}
{% block auth %}<p class="eyebrow">НАЧНИТЕ ЗДЕСЬ</p><h2>Регистрация ученика</h2><form method="post" class="stack">{% csrf_token %}<p class="hint">Учителям аккаунт создаёт администратор. Получите у него логин и пароль и нажмите «Войти».</p>{{ form.as_p }}<button class="button">Зарегистрироваться →</button></form><p class="muted">Уже с нами? <a href="{% url 'login' %}">Войти</a></p>{% endblock %}
